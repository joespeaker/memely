openapi: 3.0.3
info:
  title: Memely API
  version: 0.1.0
  description: API-first contract for searchable, shareable meme assets.
servers:
  - url: /v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /version:
    get:
      summary: Version metadata
      responses:
        '200':
          description: Version payload
  /images:
    post:
      summary: Upload image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tags:
                  type: array
                  items: { type: string }
                description:
                  type: string
                licenseConfirmation:
                  type: boolean
      responses:
        '202':
          description: Accepted to moderation queue
  /images/{id}:
    get:
      summary: Get image details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Image
  /search:
    get:
      summary: Search images
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: tags
          schema:
            type: array
            items: { type: string }
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, trending_24h, trending_7d, most_saved, most_shared, newest]
      responses:
        '200':
          description: Search results
  /reports:
    post:
      summary: Report an image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId, category]
              properties:
                imageId: { type: string, format: uuid }
                category:
                  type: string
                  enum: [copyright, hate, harassment, nsfw, other]
                details: { type: string }
      responses:
        '201':
          description: Report created
  /admin/moderation:
    get:
      summary: List moderation queue
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue entries
  /admin/moderation/{imageId}/approve:
    post:
      summary: Approve image
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Approved
  /admin/moderation/{imageId}/reject:
    post:
      summary: Reject image
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rejected
  /dmca/requests:
    post:
      summary: Submit DMCA takedown request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requesterName, requesterEmail, imageUrl, statement]
              properties:
                requesterName: { type: string }
                requesterEmail: { type: string, format: email }
                imageUrl: { type: string }
                statement: { type: string }
      responses:
        '201':
          description: DMCA request logged
  /images/{id}/share:
    get:
      summary: Get sharing links
      responses:
        '200':
          description: Share payload
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
